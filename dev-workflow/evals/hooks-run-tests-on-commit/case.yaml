schema_version: "1.1"
name: hooks-run-tests-on-commit
expected_outcome: |
  Пользователь просит вести задачу как M. В проекте хук pre-commit запускает тесты, поэтому
  красный коммит заморозки невозможен. Агент замечает это, не обходит хук и замораживает тесты контрольными суммами (freeze.sh) или
  спрашивает пользователя; итоговые коммиты проходят хук.
context:
  scaffold_script: place-files.sh
